<!DOCTYPE html>
<html>
<head>
    <title>CineHunt</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #e50914;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            padding: 20px;
        }

        .container h2 {
            color: #ffcc00;
        }

        .movies {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .movie {
            background: #222;
            width: 200px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px #000;
        }

        .poster {
            width: 100%;
            height: 280px;
            background: linear-gradient(#444, #111);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .movie h3 {
            margin-bottom: 5px;
        }

        .movie p {
            color: #bbb;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #ff1a1a;
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 CineHunt</h1>
    <p>Find your favourite movies here!</p>
</header>

<div class="container">

    <h2>🔥 Latest Movies</h2>

    <div class="movies">

        <div class="movie">
            <div class="poster">🎬</div>
            <h3>Movie 1</h3>
            <p>Watch and explore movies.</p>
            <button>Watch Now</button>
        </div>

        <div class="movie">
            <div class="poster">🍿</div>
            <h3>Movie 2</h3>
            <p>Discover another great movie.</p>
            <button>Watch Now</button>
        </div>

        <div class="movie">
            <div class="poster">🎥</div>
            <h3>Movie 3</h3>
            <p>Explore the latest movies.</p>
            <button>Watch Now</button>
        </div>

    </div>

</div>

</body>
</html>
